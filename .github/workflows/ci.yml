name: CI

# Builds the solution (warnings are errors) and runs every test: unit, component,
# architecture and the Playwright browser tests.
#
# The data and browser tests run against a real PostgreSQL in a service container. Two of the
# three layers of tenant isolation are the database's own (ADR-0012), so an in-memory provider
# would pass tests that PostgreSQL fails.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Where the tests create a database of their own for each run.
      AUTESTIQ_TEST_DB: "Host=localhost;Port=5432;Username=postgres;Password=postgres"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Nothing may run until the server answers, or the first test fails on a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Autestiq.slnx

      - name: Build
        run: dotnet build Autestiq.slnx --configuration Release --no-restore

      # The sealed-run gate tests (ADR-0026) start real containers from this image, and fail without it.
      - name: Build the worker image
        run: |
          dotnet publish src/Autestiq.Worker --configuration Release --output artifacts/worker -p:UseAppHost=false
          docker build --file src/Autestiq.Worker/Dockerfile --tag autestiq-worker:dev artifacts/worker

      - name: Install the browser for the Playwright tests
        run: >
          dotnet build tests/Autestiq.E2E --configuration Release --no-restore
          -t:InstallTestBrowser -p:PlaywrightInstallArguments="--with-deps chromium"

      # One test project at a time. The sealed-run tests (ADR-0026) create and remove Docker
      # networks, each a new host interface; Chromium takes that for a network change and aborts
      # the browser tests' requests in flight with ERR_NETWORK_CHANGED. Chromium has no documented
      # switch to ignore it, so the browser tests must not overlap them. Tests inside a project
      # still run in parallel.
      - name: Test
        run: dotnet test --solution Autestiq.slnx --configuration Release --no-build --max-parallel-test-modules 1 --report-xunit-trx --results-directory TestResults

      # Not the benchmark itself: that costs money and minutes. This proves the instrument can
      # see a false positive, by giving it a planner that writes a plan designed to pass without
      # testing anything and insisting it is caught. A report that says "0 false positives" means
      # nothing unless this holds.
      - name: Check the benchmark can catch a planner that only pretends
        run: dotnet run --project tools/Autestiq.Benchmark --configuration Release --no-build -- --self-check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
