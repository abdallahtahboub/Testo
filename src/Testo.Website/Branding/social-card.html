<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* The brand's own values, from src/Testo.UI.Shared/wwwroot/css/tokens.css. Repeated here
     rather than imported because this file is rendered once to a PNG, not served. */
  :root {
    --hero-start: #1F2170;
    --hero-end: #2E3192;
    --on-hero: #FFFFFF;
    --on-hero-muted: #C7CBFF;
    --accent: #14B8A6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: linear-gradient(135deg, var(--hero-start), var(--hero-end));
    color: var(--on-hero);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .brand { display: flex; align-items: center; gap: 20px; }

  .brand__mark {
    width: 72px; height: 72px;
    display: grid; place-items: center;
    border-radius: 18px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
  }

  .brand__name { font-size: 40px; font-weight: 650; letter-spacing: -0.02em; }

  h1 {
    font-size: 68px;
    line-height: 1.08;
    font-weight: 650;
    letter-spacing: -0.02em;
    max-width: 20ch;
  }

  .rule { width: 160px; height: 6px; border-radius: 3px; background: var(--accent); margin: 32px 0; }

  .foot { display: flex; align-items: baseline; justify-content: space-between; }
  .foot p { font-size: 26px; color: var(--on-hero-muted); }
</style>
</head>
<body>
  <div class="brand">
    <span class="brand__mark">
      <!-- The product's own mark: a check inside a bracket, drawn here as in TBrand. -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <path d="m8.5 12.5 2.5 2.5 5-5.5" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand__name">Testo</span>
  </div>

  <div>
    <h1>Quality you can see, from requirement to release</h1>
    <div class="rule"></div>
  </div>

  <div class="foot">
    <p>An AI-assisted QA platform</p>
    <p>testo.example</p>
  </div>
</body>
</html>

<!--
  The source of wwwroot/img/social-card.png, kept so the image can be regenerated rather than
  edited in a picture editor by somebody guessing at the brand's values.

  To regenerate, from the repository root:

    node tools/social-card.js

  Every colour here is a value from src/Testo.UI.Shared/wwwroot/css/tokens.css, repeated rather
  than imported because this file is rendered once to a PNG and never served. The mark is our own,
  as drawn in TBrand; nothing here is taken from anybody else's brand.
-->
