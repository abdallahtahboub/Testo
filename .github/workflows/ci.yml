name: CI

# Builds the solution (warnings are errors) and runs every test: unit, component,
# architecture and the Playwright browser tests.
#
# The data and browser tests run against a real PostgreSQL in a service container. Two of the
# three layers of tenant isolation are the database's own (ADR-0012), so an in-memory provider
# would pass tests that PostgreSQL fails.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Where the tests create a database of their own for each run.
      TESTO_TEST_DB: "Host=localhost;Port=5432;Username=postgres;Password=postgres"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Nothing may run until the server answers, or the first test fails on a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Testo.slnx

      - name: Build
        run: dotnet build Testo.slnx --configuration Release --no-restore

      - name: Install the browser for the Playwright tests
        run: >
          dotnet build tests/Testo.E2E --configuration Release --no-restore
          -t:InstallTestBrowser -p:PlaywrightInstallArguments="--with-deps chromium"

      - name: Test
        run: dotnet test --solution Testo.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
